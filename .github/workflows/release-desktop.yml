name: Release Desktop App

# Same trigger as release-docker.yml: one GitHub Release produces both the
# Docker image and the desktop installers. A workflow_dispatch run builds
# and uploads the installers as workflow artifacts only - it never touches
# the Release, so it can't reach the updater's latest.json.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version to build (e.g. v5.0.0)"
        required: true

permissions:
  contents: read

# A re-published release replaces a build in flight instead of racing it.
concurrency:
  group: release-desktop-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners only, no cross-compiling: the sqlite addon is
          # compiled per-platform by `npm ci`, and the bundled Node binary
          # is picked by the runner's own arch (scripts/stage-desktop.mjs).
          - name: macOS (Apple silicon)
            runner: macos-latest
          - name: macOS (Intel)
            runner: macos-15-intel
          - name: Windows
            # Not windows-latest: that image is Visual Studio 2026, which the
            # node-gyp bundled with Node 20 can't find, and the sqlite addon
            # has no prebuilt Node 20 binary so it must compile. Runs on
            # Windows 10 and 11. Revisit if GitHub retires this image.
            runner: windows-2022
          - name: Linux
            # Oldest LTS runner: AppImages built here run on more distros.
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    # Only this job uploads to the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve version
        shell: bash
        # Event values go through env, never straight into the script text.
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ "$EVENT_NAME" = "release" ]; then TAG="$RELEASE_TAG"; fi
          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "tag must look like v1.2.3, got: $TAG" >&2; exit 1; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "APP_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf

      - run: npm ci

      # `next build` opens a throwaway sqlite file at import time (see the
      # Dockerfile) - it needs a directory to put it in.
      - run: mkdir -p config
        shell: bash

      # A file, not inline JSON in `args`: quoting JSON through a shell
      # differs between bash and Windows. createUpdaterArtifacts is only set
      # here so a local `cargo tauri build` doesn't need the signing key.
      - name: Write release config
        shell: bash
        run: |
          node -e 'require("fs").writeFileSync("src-tauri/tauri.release.conf.json", JSON.stringify({ version: process.env.APP_VERSION, bundle: { createUpdaterArtifacts: true } }))'

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXT_PUBLIC_APP_VERSION: ${{ env.RELEASE_TAG }}
          # NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is deliberately NOT set: Next writes
          # it into the build output, and installers are public downloads. The
          # desktop server and its pages ship together, so a per-build key is fine.
        with:
          tauriScript: npm run tauri
          # Only a real published release gets uploads (and latest.json);
          # empty on workflow_dispatch, which makes this a build-only run.
          releaseId: ${{ github.event.release.id }}
          # --verbose: linuxdeploy's own output is hidden otherwise, and "failed to
          # run linuxdeploy" alone doesn't say why.
          args: --config src-tauri/tauri.release.conf.json --verbose

      # Starts the packaged server on this platform's own Node and sqlite
      # addon. A green build doesn't prove they load; this does.
      - name: Smoke test the staged server
        run: node scripts/smoke-desktop.mjs

      - name: Keep installers from a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: tally-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  # tauri-action writes latest.json with empty notes. The update window shows
  # them, so copy the release's own text in once every platform has uploaded.
  # The text goes in through env (never pasted into the script), and the
  # manifest's signatures are untouched: they cover the installers, not the notes.
  notes:
    name: Put the release notes in latest.json
    needs: [build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Copy the release text into latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --dir .
          jq --arg notes "$BODY" '.notes = $notes' latest.json > latest.new
          # Compared inside jq: shell $(...) would strip the trailing newline the release text ends with.
          jq -e --arg notes "$BODY" '.notes == $notes' latest.new > /dev/null
          mv latest.new latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
<title>Tally update</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1a1a1a; --muted: #666; --line: #d8d8d8; --accent: #2a78d6; --code: #f0f0f0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --fg: #f2f2f2; --muted: #a0a0a0; --line: #3a3a3c; --code: #2c2c2e; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; padding: 20px 20px 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { margin: 0; font-size: 18px; }
  #sub { margin: 2px 0 12px; color: var(--muted); }
  .label { margin: 0 0 6px; font-weight: 600; }
  #notes { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 14px; border: 1px solid var(--line); border-radius: 8px; }
  #notes h3 { margin: 14px 0 4px; font-size: 15px; }
  #notes h4 { margin: 12px 0 4px; font-size: 14px; }
  #notes p { margin: 6px 0; }
  #notes ul, #notes ol { margin: 6px 0; padding-left: 22px; }
  #notes li { margin: 3px 0; }
  #notes code { padding: 1px 4px; border-radius: 4px; background: var(--code); font: 12.5px ui-monospace, Menlo, Consolas, monospace; }
  #notes pre { margin: 8px 0; padding: 8px 10px; overflow-x: auto; border-radius: 6px; background: var(--code); font: 12.5px ui-monospace, Menlo, Consolas, monospace; }
  #notes pre code { padding: 0; background: none; }
  #github { display: inline-block; margin-top: 8px; color: var(--accent); font-size: 13px; }
  #status { margin: 10px 0 0; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .actions .spacer { flex: 1; }
  .btn { padding: 7px 14px; border: 1px solid var(--line); border-radius: 7px; color: var(--fg); text-decoration: none; }
  .btn.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
  .btn.quiet { border-color: transparent; color: var(--muted); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn[aria-disabled="true"] { opacity: 0.5; pointer-events: none; }
</style>
<h1 id="title">Tally update</h1>
<p id="sub"></p>
<p class="label">What's new</p>
<div id="notes" tabindex="0" role="region" aria-label="Release notes"></div>
<a id="github" href="#" hidden>View this release on GitHub</a>
<p id="status" role="status" hidden></p>
<div class="actions">
  <a class="btn quiet" data-choice href="https://tally-update.invalid/skip">Skip this version</a>
  <span class="spacer"></span>
  <a class="btn" data-choice href="https://tally-update.invalid/later">Later</a>
  <a class="btn primary" id="install" data-choice href="https://tally-update.invalid/install">Update now</a>
</div>
<script type="module" src="update.js"></script>
